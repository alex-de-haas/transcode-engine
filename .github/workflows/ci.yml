name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: engine (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/TranscodeEngine.Api/TranscodeEngine.Api.csproj

      - name: Build
        run: dotnet build src/TranscodeEngine.Api/TranscodeEngine.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test src/TranscodeEngine.Api.Tests/TranscodeEngine.Api.Tests.csproj --configuration Release

  docs:
    name: docs index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check docs index and headers
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOCS_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test scripts/docs-format.test.mjs scripts/docs-git.test.mjs
          node scripts/docs-index.mjs --check