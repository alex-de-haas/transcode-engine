name: Claude Code Review

# Runs the Claude Code `code-review` plugin once per pull request: when it is opened as a non-draft,
# or when a draft is marked ready for review. Later pushes to the branch do not re-run it: convert
# the PR back to draft and mark it ready again to get a fresh review.
#
# Authenticates with a Claude subscription token (`claude setup-token`) stored in the
# CLAUDE_CODE_OAUTH_TOKEN repository secret, so each run draws from that subscription's usage
# window rather than API billing.
on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    # `opened` also fires for draft pull requests; those wait for `ready_for_review`. Pull requests
    # from forks and from bots such as Dependabot are skipped: GitHub withholds repository secrets
    # from both, so the run could only fail for lack of a token, and the action rejects bot actors
    # anyway.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    # A read-only GITHUB_TOKEN is enough: the action posts its comments with a Claude GitHub App
    # token that it obtains through OIDC (`id-token: write`), not with GITHUB_TOKEN.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1.0.217
        env:
          # The plugin fans the review out to subagents, which Claude Code starts in the background;
          # the print-mode session can then finish before they report. This keeps them in the
          # foreground, so the main agent continues only once each result is in.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # `--comment` posts one inline comment per finding, or a single summary comment when there
          # are none. Without it the findings only appear in the workflow run log.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # In agent mode the action grants no tools beyond this list, and the plugin's own
          # frontmatter covers only a few `gh pr` / `gh issue` forms for the main agent. The
          # subagents that do the actual review read the pull request through `gh pr`, `gh api`
          # and `gh search` (read-only `git` is allowed by Claude Code itself), so without these
          # grants every subagent is denied and the run ends green with nothing to post. `gh` runs
          # with the Claude GitHub App token, so this is broader than read-only; the `if:` above
          # limits the job to human-authored pull requests from this repository.
          # The inline-comment tool must be named here too: the action starts its MCP server only
          # when `--allowedTools` lists the tool, even though the skill's frontmatter already does.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr:*),Bash(gh api:*),Bash(gh search:*),Bash(gh issue:*)"
